# Local Postgres + Redis for the ledger and product services. Not the chain: that is chain/scripts.
name: settlement-services
services:
  postgres:
    image: postgres:16-alpine
    container_name: settlement-postgres
    environment:
      POSTGRES_USER: settlement
      POSTGRES_PASSWORD: settlement
      POSTGRES_DB: settlement
    ports: ["5439:5432"]
    volumes: ["settlement-pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U settlement -d settlement"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    container_name: settlement-redis
    ports: ["6389:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  settlement-pg: {}
